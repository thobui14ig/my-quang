services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: my_quang
      POSTGRES_USER: my_quang
      POSTGRES_PASSWORD: abcd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_quang -d my_quang"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: my_quang
      PGPASSWORD: abcd
      PGDATABASE: my_quang
      JWT_SECRET: 8f3d9a7c2e6b1f4a0d8c5e7b9a2f6d1c4e8b3a7f0d5c9e2b6a1f4d8c7e3b9a5f
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
